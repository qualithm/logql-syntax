name: Security Audit

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  GOVULNCHECK_VERSION: v1.3.0

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Run gosec
        uses: securego/gosec@4a3bd8af174872c778439083ded7adbf3747e770 # v2.26.1
        env:
          GOTOOLCHAIN: auto
        with:
          args: -exclude-dir=syntax -exclude-dir=log -exclude-dir=internal ./...

  sync-check:
    name: Upstream Sync Drift
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Resolve pinned Loki version
        id: pin
        run: |
          ver=$(awk -F'"' '/^LOKI_VERSION="\$\{1:-/ {print $2}' scripts/sync-upstream.sh | sed 's/.*-//;s/}//')
          echo "Pinned Loki version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Prime module cache
        run: go mod download github.com/grafana/loki/v3@${{ steps.pin.outputs.version }}
      - name: Re-run sync script
        run: bash scripts/sync-upstream.sh ${{ steps.pin.outputs.version }}
      - name: Fail on drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Vendored upstream files are out of sync with Loki ${{ steps.pin.outputs.version }}."
            echo "Run 'scripts/sync-upstream.sh' locally and commit the result."
            exit 1
          fi
