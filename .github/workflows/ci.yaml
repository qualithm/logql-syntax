name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Two upstream Loki tests hardcode local-tz dates and drift; skip them.
  # Tracked at upstream issue not yet filed; safe to skip since we don't run
  # the log formatter at runtime.
  SKIP_TESTS: "Test_lineFormatter_Format/timestamp|Test_labelsFormatter_Format/timestamp"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Format check
        # Only enforce gofmt on files we own. Vendored Loki source under
        # syntax/, log/, and internal/ is held to upstream's formatting.
        run: |
          out=$(gofmt -s -l ./*.go logqlmodel/)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum 2>/dev/null; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy'."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test
        run: go test -race -count=1 -skip "$SKIP_TESTS" ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic -skip "$SKIP_TESTS" ./...
      - name: Enforce first-party coverage threshold
        run: |
          # Gate only on first-party (non-vendored, non-generated) packages.
          # Vendored Loki code under syntax/, log/, internal/ is informational.
          head -n1 coverage.out > coverage.firstparty.out
          grep -E '^github.com/qualithm/logql-syntax/logqlmodel/' coverage.out \
            | grep -v '\.y\.go:' >> coverage.firstparty.out || true
          pct=$(go tool cover -func=coverage.firstparty.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "First-party coverage (logqlmodel/): ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80.0) { print "first-party coverage below 80%"; exit 1 } }'
      - name: Split coverage into upstream profile
        run: |
          head -n1 coverage.out > coverage.upstream.out
          grep -E '^github.com/qualithm/logql-syntax/(syntax|log|internal)/' coverage.out \
            | grep -v '\.y\.go:' >> coverage.upstream.out || true
      - name: Upload first-party coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.firstparty.out
          flags: firstparty
          fail_ci_if_error: false
      - name: Upload upstream coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.upstream.out
          flags: upstream
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
