name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Two upstream Loki tests hardcode local-tz dates and drift; skip them.
  # Tracked at upstream issue not yet filed; safe to skip since we don't run
  # the log formatter at runtime.
  SKIP_TESTS: "Test_lineFormatter_Format/timestamp|Test_labelsFormatter_Format/timestamp"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Format check
        # Only enforce gofmt on files we own. Vendored Loki source under
        # syntax/, log/, and internal/ is held to upstream's formatting.
        run: |
          out=$(gofmt -s -l ./*.go logqlmodel/)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum 2>/dev/null; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy'."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test
        run: go test -race -count=1 -skip "$SKIP_TESTS" ./...

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
